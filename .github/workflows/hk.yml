name: hk

permissions: {}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/gh-workflows/setup@dc6a964b5719583fa4067a2975016a6bab1bde7c # v1.38.5
      - uses: hugoh/gh-workflows/hk-check@dc6a964b5719583fa4067a2975016a6bab1bde7c # v1.38.5
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
