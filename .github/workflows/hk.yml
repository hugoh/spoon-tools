name: hk

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/gh-workflows/setup@b7cf853500d5d3c9746bdb5c322405084227ff3a # v1.40.12
      - name: Sync Python dependencies
        run: uv sync --group dev
      - uses: hugoh/gh-workflows/hk-check@b7cf853500d5d3c9746bdb5c322405084227ff3a # v1.40.12
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
