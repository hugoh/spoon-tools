name: hk

permissions: {}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: hugoh/gh-workflows/setup@76cbcbdfd23f89a1fb565f4ee4c8964138bc28e7 # v1.40.2
      - name: Sync Python dependencies
        run: uv sync --group dev
      - uses: hugoh/gh-workflows/hk-check@76cbcbdfd23f89a1fb565f4ee4c8964138bc28e7 # v1.40.2
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
