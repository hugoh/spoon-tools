---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        required: false
        type: string
      notes:
        description: "Release notes body (default: GitHub auto-generated notes)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@89be8ed3394b541d853b9dab2ab968fcc3db831a # v1.30.0
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || '' }}
      notes: ${{ inputs.notes || '' }}
