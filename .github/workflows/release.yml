---
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a GitHub Release for; skips the bump
        required: false
        type: string
      bump:
        description: Force the bump level (auto = derive from commits). Ignored when tag is set.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      notes:
        description: "Release notes body (default: GitHub auto-generated notes)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: hugoh/gh-workflows/.github/workflows/release.yml@7411f5764f11602df3a0e261d428d3e7a69e59a7 # v1.38.2
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      notes: ${{ inputs.notes || '' }}
