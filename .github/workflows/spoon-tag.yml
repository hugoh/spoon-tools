on:
  workflow_call:

permissions:
  contents: read

# Scoped to the calling spoon repo. Serialize tag bumps; never cancel one.
concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: bump
        uses: hugoh/cog-bump@33bfd335a437a1cf30db4cf9a2710fc9f4d31ec9 # v0.1.0

      - name: Trigger release for new tag
        if: steps.bump.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: gh workflow run release.yml --ref "$NEW_TAG"
