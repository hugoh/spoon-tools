on:
  workflow_call:
    inputs:
      spoon_name:
        description: Spoon name (e.g. AudioPilot) — used for the zip filename and must match obj.name in init.lua
        type: string
        required: true
      tag:
        description: Existing tag to (re-)release; skips the Conventional-Commit bump. Leave empty for normal push-to-main use.
        type: string
        required: false
      bump:
        description: >-
          Force the bump level instead of deriving it from the commits: auto
          (default), patch, minor, major. Ignored when tag is set.
        type: string
        default: auto
      docs_only:
        description: Regenerate and redeploy the Pages docs only; no bump, no GitHub Release. Uses `tag`, or the latest tag if empty.
        type: boolean
        default: false

permissions:
  contents: read

# Scoped to the calling spoon repo. Serialize releases (and the Pages deploy
# that needs them); never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: hugoh/gh-workflows/setup@98894bfdb331f6bfc3e1b7a1d1ddbe637080a031 # v1.40.4
        with:
          fetch-depth: "0"

      - id: bump
        if: inputs.tag == '' && !inputs.docs_only
        uses: hugoh/cog-bump@ac73ff77235d0567cfce5f004243e980521728c2 # v0.3.2
        with:
          bump: ${{ inputs.bump || 'auto' }}

      - id: resolve
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || steps.bump.outputs.tag }}
          DOCS_ONLY: ${{ inputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = true ] && [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag to release
        if: steps.resolve.outputs.tag != ''
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: git checkout "$TAG"

      - name: Stamp version into init.lua
        if: steps.resolve.outputs.tag != ''
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/obj.version = \"[^\"]*\"/obj.version = \"$VERSION\"/" init.lua

      - name: Package Spoon
        if: steps.resolve.outputs.tag != ''
        run: mise run package

      - name: Create GitHub Release
        if: steps.resolve.outputs.tag != '' && !inputs.docs_only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SPOON_NAME: ${{ inputs.spoon_name }}
          COG_NOTES: ${{ steps.bump.outputs.notes }}
        run: |
          set -euo pipefail
          # Prefer cog's Conventional-Commit changelog (grouped by feat/fix/...);
          # fall back to GitHub's auto-generated notes when re-releasing a tag.
          if [ -n "$COG_NOTES" ]; then
            printf '%s' "$COG_NOTES" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" "${SPOON_NAME}.spoon.zip" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" "${SPOON_NAME}.spoon.zip" --verify-tag --title "$TAG" --generate-notes
          fi

      - name: Scan generated docs for secrets
        if: steps.resolve.outputs.tag != ''
        run: gitleaks dir docs/ --no-banner --redact

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.resolve.outputs.tag != ''
        with:
          path: docs/

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
