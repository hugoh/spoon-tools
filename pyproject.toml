[project]
name = "spoon-scripts"
version = "0.1.0"
description = "Shared scripts for Hammerspoon Spoon repositories"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "linkify-it-py>=2",
    "markdown-it-py>=3",
]

[project.scripts]
spoon-generate-docs = "generate_docs:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["generate_docs.py"]

[tool.ruff]
target-version = "py311"
